version: '3.8'

# ============================================================================
# AIS Ship Tracker – unified Docker Compose
#
# Brings up:  zookeeper · kafka · kafka-ui · postgres
#             ais-producer · elt-processor · live-data-consumer
#             position-history-consumer · ship-static-data-processor
#             ship-static-data-consumer · webapp
#
# Usage:
#   docker compose up --build          # first run (builds images)
#   docker compose up -d               # detached
#   docker compose down -v             # stop + delete postgres volume
#
# NOTE: The standalone kafka/docker-compose.yml is kept for isolated Kafka
#       development.  Do not run both simultaneously – they share port 9092/9093.
# ============================================================================

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_SYNC_LIMIT: 5
    healthcheck:
      test: ["CMD", "zookeeper-shell", "localhost:2181", "ls", "/zookeeper"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - ais-network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"   # inter-container
      - "9093:9093"   # host access
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093
      # PLAINTEXT  → used by containers on ais-network  (kafka:9092)
      # PLAINTEXT_HOST → used from the host machine     (localhost:9093)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_MS: ${KAFKA_LOG_RETENTION_MS:-9000000}  # 2.5 hours default
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ais-network
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "false"
      KAFKA_CLUSTERS_0_NAME: AISAPItestcluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - ais-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ais-network
    restart: unless-stopped

  # ── Python apps ─────────────────────────────────────────────────────────────
  # Build context is ./python_apps so the shared requirements.txt is reachable.
  # Each Dockerfile copies only its own subdirectory into /app.

  ais-producer:
    build:
      context: ./python_apps
      dockerfile: ais_producer/Dockerfile
    container_name: ais-producer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AIS_PRODUCER_MONITORING_TOPIC: ${AIS_PRODUCER_MONITORING_TOPIC}
      API_KEY: ${API_KEY}
    networks:
      - ais-network
    restart: unless-stopped

  ships_live_data_processor:
    build:
      context: ./python_apps
      dockerfile: ships_live_data_processor/Dockerfile
    container_name: ships_live_data_processor
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INPUT_TOPIC: ${INPUT_TOPIC}
      LIVE_DATA_TOPIC: ${LIVE_DATA_TOPIC}
      ELT_CONSUMER_GROUP_ID: ${ELT_CONSUMER_GROUP_ID}
    networks:
      - ais-network
    restart: unless-stopped

  ships_live_data_consumer:
    build:
      context: ./python_apps
      dockerfile: ships_live_data_consumer/Dockerfile
    container_name: ships_live_data_consumer
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LIVE_DATA_TOPIC: ${LIVE_DATA_TOPIC}
      LIVE_DATA_CONSUMER_GROUP_ID: ${LIVE_DATA_CONSUMER_GROUP_ID}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      LIVE_DATA_BATCH_SIZE: ${LIVE_DATA_BATCH_SIZE:-500}
    networks:
      - ais-network
    restart: unless-stopped

  position-history-consumer:
    build:
      context: ./python_apps
      dockerfile: position_history_consumer/Dockerfile
    container_name: position-history-consumer
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LIVE_DATA_TOPIC: ${LIVE_DATA_TOPIC}
      POSITION_HISTORY_CONSUMER_GROUP_ID: ${POSITION_HISTORY_CONSUMER_GROUP_ID}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      POSITION_HISTORY_BATCH_SIZE: ${POSITION_HISTORY_BATCH_SIZE}
      TRACKING_REFRESH_INTERVAL: ${TRACKING_REFRESH_INTERVAL}
      AUTO_OFFSET_RESET: ${AUTO_OFFSET_RESET}
    networks:
      - ais-network
    restart: unless-stopped

  ships-static-data-processor:
    build:
      context: ./python_apps
      dockerfile: ships_static_data_processor/Dockerfile
    container_name: ships-static-data-processor
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SHIP_STATIC_DATA_INPUT_TOPIC: ${SHIP_STATIC_DATA_INPUT_TOPIC}
      SHIP_STATIC_DATA_OUTPUT_TOPIC: ${SHIP_STATIC_DATA_OUTPUT_TOPIC}
      SHIP_STATIC_DATA_CONSUMER_GROUP_ID: ${SHIP_STATIC_DATA_CONSUMER_GROUP_ID}
    networks:
      - ais-network
    restart: unless-stopped

  ships-static-data-consumer:
    build:
      context: ./python_apps
      dockerfile: ships_static_data_consumer/Dockerfile
    container_name: ships-static-data-consumer
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SHIP_STATIC_DATA_OUTPUT_TOPIC: ${SHIP_STATIC_DATA_OUTPUT_TOPIC}
      SHIP_STATIC_DATA_DB_CONSUMER_GROUP_ID: ${SHIP_STATIC_DATA_DB_CONSUMER_GROUP_ID}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SHIP_STATIC_DATA_BATCH_SIZE: ${SHIP_STATIC_DATA_BATCH_SIZE:-50}
    networks:
      - ais-network
    restart: unless-stopped

  # ── Web application ──────────────────────────────────────────────────────────

  webapp:
    build: ./webapp
    container_name: webapp
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - ais-network
    restart: unless-stopped

  # ── Tracking sync (one-shot tool) ────────────────────────────────────────────
  # Reads config/tracked_ship_ids.json and reconciles it with tracking_config.
  # Does NOT start with `docker compose up` (profiles: tools).
  # Run manually:  docker compose run --rm tracking-sync
  tracking-sync:
    build:
      context: ./python_apps
      dockerfile: tracking_sync/Dockerfile
    container_name: tracking-sync
    profiles:
      - tools
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config:/config:ro
    environment:
      TRACKED_SHIP_IDS_PATH: /config/tracked_ship_ids.json
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - ais-network
    restart: "no"

# ── Shared network ────────────────────────────────────────────────────────────
networks:
  ais-network:
    name: ais-network

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:
