<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIS Ship Tracker</title>

  <!-- MapLibre GL JS -->
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body { font-family: 'Segoe UI', Arial, sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }

    /* ── Header ─────────────────────────────────────────────── */
    #header {
      background: #16213e;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid #0f3460;
      z-index: 10;
      flex-shrink: 0;
    }
    #header h1 { font-size: 1.1rem; color: #e94560; letter-spacing: 1px; }
    #header .meta { font-size: 0.75rem; color: #888; margin-left: auto; }
    #refresh-btn {
      background: #0f3460;
      color: #e0e0e0;
      border: 1px solid #e94560;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: background 0.2s;
    }
    #refresh-btn:hover { background: #e94560; }

    /* ── Main layout ─────────────────────────────────────────── */
    #main { display: flex; flex: 1; overflow: hidden; }

    /* ── Sidebar ─────────────────────────────────────────────── */
    #sidebar {
      width: 280px;
      background: #16213e;
      border-right: 1px solid #0f3460;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    #sidebar-header {
      padding: 10px 12px;
      background: #0f3460;
      font-size: 0.85rem;
      font-weight: 600;
      color: #e94560;
      letter-spacing: 0.5px;
    }
    #search-box {
      margin: 8px;
      padding: 6px 8px;
      background: #0f3460;
      border: 1px solid #1a4a7a;
      color: #e0e0e0;
      border-radius: 4px;
      font-size: 0.8rem;
      width: calc(100% - 16px);
    }
    #search-box::placeholder { color: #666; }
    #ship-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }
    #ship-list::-webkit-scrollbar { width: 5px; }
    #ship-list::-webkit-scrollbar-track { background: #0f3460; }
    #ship-list::-webkit-scrollbar-thumb { background: #e94560; border-radius: 3px; }

    .ship-item {
      display: flex;
      align-items: center;
      padding: 6px 12px;
      cursor: pointer;
      border-bottom: 1px solid #0f3460;
      transition: background 0.15s;
      gap: 8px;
    }
    .ship-item:hover { background: #0f3460; }
    .ship-item.selected { background: #1a4a7a; }

    .ship-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .ship-dot.tracked { background: #e94560; }
    .ship-dot.live    { background: #4ecdc4; }

    .ship-info { flex: 1; min-width: 0; }
    .ship-name { font-size: 0.8rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ship-meta { font-size: 0.7rem; color: #888; }

    .popup-history-btn { margin-top: 8px; text-align: center; }

    .history-toggle {
      padding: 2px 8px;
      font-size: 0.7rem;
      border-radius: 3px;
      cursor: pointer;
      border: 1px solid #4ecdc4;
      color: #4ecdc4;
      background: transparent;
      white-space: nowrap;
      transition: background 0.2s, color 0.2s;
    }
    .history-toggle:hover,
    .history-toggle.active { background: #4ecdc4; color: #1a1a2e; }

    /* ── Map ─────────────────────────────────────────────────── */
    #map { flex: 1; }

    /* ── Info popup (custom) ─────────────────────────────────── */
    .maplibregl-popup-content {
      background: #16213e !important;
      color: #e0e0e0 !important;
      border: 1px solid #0f3460 !important;
      border-radius: 6px !important;
      padding: 10px 14px !important;
      font-size: 0.8rem !important;
      min-width: 180px;
    }
    .maplibregl-popup-tip { border-top-color: #16213e !important; }
    .popup-title { font-weight: 700; font-size: 0.9rem; color: #e94560; margin-bottom: 6px; }
    .popup-row { display: flex; justify-content: space-between; margin-bottom: 3px; }
    .popup-label { color: #888; }
    .popup-value { font-weight: 600; }

    /* ── Toast ───────────────────────────────────────────────── */
    #toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #0f3460; color: #e0e0e0; padding: 8px 18px; border-radius: 20px;
      font-size: 0.8rem; opacity: 0; transition: opacity 0.3s; pointer-events: none;
      z-index: 999; border: 1px solid #e94560;
    }
    #toast.show { opacity: 1; }

    /* ── Stale toggle ────────────────────────────────────────── */
    .stale-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 0.78rem;
      color: #aaa;
      user-select: none;
      white-space: nowrap;
    }
    .stale-toggle input { display: none; }
    .stale-slider {
      width: 32px; height: 18px;
      background: #0f3460;
      border-radius: 9px;
      position: relative;
      border: 1px solid #1a4a7a;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .stale-slider::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #888;
      transition: transform 0.2s, background 0.2s;
    }
    .stale-toggle input:checked + .stale-slider { background: #e94560; border-color: #e94560; }
    .stale-toggle input:checked + .stale-slider::after { transform: translateX(14px); background: #fff; }

    /* ── Ship Details Modal ──────────────────────────────────── */
    #ship-details-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    #ship-details-overlay.open { display: flex; }
    #ship-details-modal {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 20px 24px;
      min-width: 300px;
      max-width: 420px;
      width: 90%;
      position: relative;
      color: #e0e0e0;
      font-size: 0.85rem;
    }
    #ship-details-modal h2 {
      color: #e94560;
      font-size: 1rem;
      margin-bottom: 14px;
      padding-right: 24px;
    }
    .modal-close {
      position: absolute;
      top: 12px; right: 14px;
      background: none;
      border: none;
      color: #888;
      font-size: 1.2rem;
      cursor: pointer;
      line-height: 1;
    }
    .modal-close:hover { color: #e94560; }
    .modal-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      gap: 12px;
    }
    .modal-label { color: #888; white-space: nowrap; }
    .modal-value { font-weight: 600; text-align: right; word-break: break-word; }
    .details-btn {
      padding: 2px 8px;
      font-size: 0.7rem;
      border-radius: 3px;
      cursor: pointer;
      border: 1px solid #e94560;
      color: #e94560;
      background: transparent;
      white-space: nowrap;
      transition: background 0.2s, color 0.2s;
    }
    .details-btn:hover { background: #e94560; color: #1a1a2e; }
  </style>
</head>

<body>
  <!-- Header -->
  <div id="header">
    <h1>⚓ AIS Ship Tracker</h1>
    <button id="refresh-btn" onclick="refreshData()">↻ Refresh</button>
    <label class="stale-toggle" title="Hide ships whose last update is older than 1 hour">
      <input type="checkbox" id="hide-stale-toggle" onchange="onHideStaleToggle(this.checked)" />
      <span class="stale-slider"></span>
      Hide stale (&gt;1 h)
    </label>
    <label class="stale-toggle" title="Show only actively tracked ships">
      <input type="checkbox" id="tracked-only-toggle" onchange="onTrackedOnlyToggle(this.checked)" />
      <span class="stale-slider"></span>
      Tracked only
    </label>
    <span class="meta" id="status-text">Loading…</span>
  </div>

  <div id="main">
    <!-- Sidebar -->
    <div id="sidebar">
      <div id="sidebar-header">Live Ships</div>
      <input id="search-box" type="text" placeholder="Search ship name or MMSI…" oninput="filterShipList()" />
      <div id="ship-list"></div>
    </div>

    <!-- Map -->
    <div id="map"></div>
  </div>

  <div id="toast"></div>

  <!-- Ship Details Modal -->
  <div id="ship-details-overlay" onclick="closeShipDetails(event)">
    <div id="ship-details-modal">
      <button class="modal-close" onclick="closeShipDetails()">✕</button>
      <h2 id="modal-title">Ship Details</h2>
      <div id="modal-body"></div>
    </div>
  </div>

  <script>
    // ── Constants ────────────────────────────────────────────────────────────
    const REFRESH_INTERVAL_MS = 30_000;
    const HISTORY_LINE_COLOR  = '#f7c59f';
    const HISTORY_POINT_COLOR = '#ff6b6b';
    const SHIP_COLOR_TRACKED  = '#e94560';
    const SHIP_COLOR_LIVE     = '#4ecdc4';

    // ── State ────────────────────────────────────────────────────────────────
    let map;
    let liveFeatures    = [];          // current GeoJSON features
    let activeHistory  = new Set();   // ship_ids with history shown
    let refreshTimer   = null;
    let hideStaleShips  = false;
    let trackedOnly     = false;

    // ── Toast helper ─────────────────────────────────────────────────────────
    function showToast(msg, duration = 2500) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), duration);
    }

    // ── Ship icon (SVG arrow pointing north = COG 0°) ────────────────────────
    function createShipSVG(color) {
      // Simple arrowhead: points up (north). MapLibre rotates it by COG.
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
        <polygon points="12,2 18,20 12,16 6,20" fill="${color}" stroke="#fff" stroke-width="1.2"/>
      </svg>`;
      return svg;
    }

    function svgToImageData(svgStr) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const blob = new Blob([svgStr], { type: 'image/svg+xml' });
        const url  = URL.createObjectURL(blob);
        img.onload = () => {
          const w = img.naturalWidth;
          const h = img.naturalHeight;
          const canvas = document.createElement('canvas');
          canvas.width  = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          URL.revokeObjectURL(url);
          const imageData = ctx.getImageData(0, 0, w, h);
          resolve({ data: imageData.data, width: w, height: h });
        };
        img.onerror = reject;
        img.src = url;
      });
    }

    // ── Map initialisation ───────────────────────────────────────────────────
    async function initMap() {
      map = new maplibregl.Map({
        container: 'map',
        style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
        center: [10, 50],
        zoom: 4,
        attributionControl: false,
      });

      map.addControl(new maplibregl.NavigationControl(), 'top-right');
      map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-right');
      map.addControl(new maplibregl.ScaleControl({ unit: 'nautical' }), 'bottom-left');

      map.on('load', async () => {
        // Register ship icons
        const [imgTracked, imgLive] = await Promise.all([
          svgToImageData(createShipSVG(SHIP_COLOR_TRACKED)),
          svgToImageData(createShipSVG(SHIP_COLOR_LIVE)),
        ]);
        map.addImage('ship-tracked', imgTracked);
        map.addImage('ship-live',    imgLive);

        // ── Live ships source & layers ───────────────────────────────────────
        map.addSource('ships', {
          type: 'geojson',
          data: { type: 'FeatureCollection', features: [] },
        });

        // Halo for tracked ships
        map.addLayer({
          id: 'ships-halo',
          type: 'circle',
          source: 'ships',
          filter: ['==', ['get', 'tracked'], true],
          paint: {
            'circle-radius': 14,
            'circle-color': SHIP_COLOR_TRACKED,
            'circle-opacity': 0.15,
            'circle-stroke-width': 1,
            'circle-stroke-color': SHIP_COLOR_TRACKED,
            'circle-stroke-opacity': 0.5,
          },
        });

        // Ship icons (rotated by COG)
        map.addLayer({
          id: 'ships-icons',
          type: 'symbol',
          source: 'ships',
          layout: {
            'icon-image': ['case', ['get', 'tracked'], 'ship-tracked', 'ship-live'],
            'icon-size': 1,
            'icon-rotate': ['get', 'course_over_ground'],
            'icon-rotation-alignment': 'map',
            'icon-allow-overlap': true,
            'icon-ignore-placement': true,
          },
        });

        // Click handler on ships
        map.on('click', 'ships-icons', onShipClick);
        map.on('mouseenter', 'ships-icons', () => { map.getCanvas().style.cursor = 'pointer'; });
        map.on('mouseleave', 'ships-icons', () => { map.getCanvas().style.cursor = ''; });

        // ── History sources / layers (one per ship, created on demand) ───────
        // (handled dynamically in toggleHistory)

        await refreshData();
        refreshTimer = setInterval(refreshData, REFRESH_INTERVAL_MS);
      });
    }

    // ── Fetch & render live data ─────────────────────────────────────────────
    async function refreshData() {
      try {
        const resp = await fetch('/api/ships/live');
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const geojson = await resp.json();

        liveFeatures = geojson.features || [];
        const visible = getVisibleFeatures();
        map.getSource('ships').setData({ type: 'FeatureCollection', features: visible });

        updateSidebar();

        const ts = new Date().toLocaleTimeString();
        document.getElementById('status-text').textContent =
          `${visible.length} ships  ·  updated ${ts}`;
      } catch (err) {
        console.error('Failed to fetch live data', err);
        document.getElementById('status-text').textContent = '⚠ Refresh failed';
        showToast('Could not load ship data – retrying…');
      }
    }

    // ── Sidebar ──────────────────────────────────────────────────────────────
    function updateSidebar() {
      const query = document.getElementById('search-box').value.toLowerCase();
      renderShipList(query);
    }

    function filterShipList() {
      renderShipList(document.getElementById('search-box').value.toLowerCase());
    }

    function renderShipList(query = '') {
      const list = document.getElementById('ship-list');
      const visible = getVisibleFeatures();
      const filtered = query
        ? visible.filter(f => {
            const p = f.properties;
            return (p.ship_name || '').toLowerCase().includes(query)
              || String(p.ship_id).includes(query);
          })
        : visible;

      // Sort: tracked first, then by name
      const sorted = [...filtered].sort((a, b) => {
        if (a.properties.tracked !== b.properties.tracked) return a.properties.tracked ? -1 : 1;
        return (a.properties.ship_name || '').localeCompare(b.properties.ship_name || '');
      });

      list.innerHTML = '';
      sorted.forEach(f => {
        const p = f.properties;
        const item = document.createElement('div');
        item.className = 'ship-item' + (activeHistory.has(p.ship_id) ? ' selected' : '');
        item.dataset.shipId = p.ship_id;

        const dot = document.createElement('div');
        dot.className = 'ship-dot ' + (p.tracked ? 'tracked' : 'live');

        const info = document.createElement('div');
        info.className = 'ship-info';
        info.innerHTML = `
          <div class="ship-name">${escHtml(p.ship_name || 'Unknown')}</div>
          <div class="ship-meta">MMSI ${p.ship_id} · ${p.speed_over_ground != null ? p.speed_over_ground + ' kn' : '—'} · ${p.course_over_ground != null ? p.course_over_ground + '°' : '—'}</div>
        `;

        item.appendChild(dot);
        item.appendChild(info);

        if (p.tracked) {
          const btn = document.createElement('button');
          btn.className = 'history-toggle' + (activeHistory.has(p.ship_id) ? ' active' : '');
          btn.textContent = activeHistory.has(p.ship_id) ? '✕ Hide' : '⟳ Track';
          btn.onclick = (e) => { e.stopPropagation(); toggleHistory(p.ship_id); };
          item.appendChild(btn);
        }

        // Click on item → fly to + show popup
        item.onclick = () => flyToShip(f);

        list.appendChild(item);
      });
    }

    // ── Fly to ship ───────────────────────────────────────────────────────────
    function flyToShip(feature) {
      const coords = feature.geometry.coordinates;
      map.flyTo({ center: coords, zoom: Math.max(map.getZoom(), 8), speed: 1.2 });
      showShipPopup(feature, coords);
    }

    // ── Ship popup ────────────────────────────────────────────────────────────
    let currentPopup = null;

    function onShipClick(e) {
      const feature = e.features[0];
      showShipPopup(feature, feature.geometry.coordinates.slice());
    }

    function showHistoryPointPopup(feature, coords, shipId) {
      const p = feature.properties;
      if (currentPopup) currentPopup.remove();

      const sog = p.speed_over_ground != null ? Number(p.speed_over_ground).toFixed(1) : null;
      const recordedAt = p.recorded_at ? new Date(p.recorded_at).toLocaleString() : '—';

      // Find ship name from liveFeatures
      const liveShip = liveFeatures.find(f => f.properties.ship_id === shipId);
      const shipName = liveShip ? liveShip.properties.ship_name : `MMSI ${shipId}`;

      const html = `
        <div class="popup-title">📅 ${escHtml(shipName || 'Unknown Ship')}</div>
        <div class="popup-row"><span class="popup-label">MMSI</span><span class="popup-value">${shipId}</span></div>
        <div class="popup-row"><span class="popup-label">Recorded</span><span class="popup-value">${recordedAt}</span></div>
        <div class="popup-row"><span class="popup-label">COG</span><span class="popup-value">${p.course_over_ground != null ? p.course_over_ground + '°' : '—'}</span></div>
        <div class="popup-row"><span class="popup-label">SOG</span><span class="popup-value">${sog != null ? sog + ' kn' : '—'}</span></div>
        <div class="popup-row"><span class="popup-label">Status</span><span class="popup-value">${escHtml(p.navigational_status || '—')}</span></div>
      `;

      currentPopup = new maplibregl.Popup({ closeButton: true, closeOnClick: false, maxWidth: '260px' })
        .setLngLat(coords)
        .setHTML(html)
        .addTo(map);
    }

    function showShipPopup(feature, coords) {
      const p = feature.properties;
      if (currentPopup) currentPopup.remove();

      const sog = typeof p.speed_over_ground === 'number' ? p.speed_over_ground.toFixed(1) : p.speed_over_ground;
      const updatedAt = p.updated_at ? new Date(p.updated_at).toLocaleString() : '—';

      const html = `
        <div class="popup-title">${escHtml(p.ship_name || 'Unknown Ship')}</div>
        <div class="popup-row"><span class="popup-label">MMSI</span><span class="popup-value">${p.ship_id}</span></div>
        <div class="popup-row"><span class="popup-label">COG</span><span class="popup-value">${p.course_over_ground != null ? p.course_over_ground + '°' : '—'}</span></div>
        <div class="popup-row"><span class="popup-label">SOG</span><span class="popup-value">${sog != null ? sog + ' kn' : '—'}</span></div>
        <div class="popup-row"><span class="popup-label">Status</span><span class="popup-value">${escHtml(p.navigational_status || '—')}</span></div>
        <div class="popup-row"><span class="popup-label">Updated</span><span class="popup-value">${updatedAt}</span></div>
        <div class="popup-history-btn">
          ${p.tracked ? `<button class="history-toggle ${activeHistory.has(p.ship_id) ? 'active' : ''}" onclick="toggleHistory(${p.ship_id})">${activeHistory.has(p.ship_id) ? '✕ Hide History' : '⟳ Show History'}</button>` : ''}
          <button class="details-btn" onclick="openShipDetails(${p.ship_id})">📋 Ship Details</button>
        </div>
      `;

      currentPopup = new maplibregl.Popup({ closeButton: true, closeOnClick: false, maxWidth: '260px' })
        .setLngLat(coords)
        .setHTML(html)
        .addTo(map);
    }

    // ── Position history ──────────────────────────────────────────────────────
    async function toggleHistory(shipId) {
      if (activeHistory.has(shipId)) {
        removeHistory(shipId);
      } else {
        await loadHistory(shipId);
      }
      // Re-render sidebar to update buttons
      renderShipList(document.getElementById('search-box').value.toLowerCase());
      // Update popup button if open
      if (currentPopup && currentPopup.isOpen()) {
        // Re-click logic: just close so user re-clicks; simpler than re-rendering popup.
      }
    }

    async function loadHistory(shipId) {
      showToast('Loading history…', 1500);
      try {
        const resp = await fetch(`/api/ships/${shipId}/history`);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const geojson = await resp.json();

        if (!geojson.features || geojson.features.length === 0) {
          showToast('No history available for this ship.');
          return;
        }

        // Add source
        const srcId  = `history-${shipId}`;
        const lineId = `history-line-${shipId}`;
        const ptId   = `history-pts-${shipId}`;

        if (!map.getSource(srcId)) {
          map.addSource(srcId, { type: 'geojson', data: geojson });
        } else {
          map.getSource(srcId).setData(geojson);
        }

        if (!map.getLayer(lineId)) {
          map.addLayer({
            id: lineId,
            type: 'line',
            source: srcId,
            filter: ['==', ['get', 'type'], 'track'],
            paint: {
              'line-color': HISTORY_LINE_COLOR,
              'line-width': 2,
              'line-opacity': 0.8,
              'line-dasharray': [3, 2],
            },
          }, 'ships-halo'); // insert below ship layers
        }

        if (!map.getLayer(ptId)) {
          map.addLayer({
            id: ptId,
            type: 'circle',
            source: srcId,
            filter: ['!=', ['get', 'type'], 'track'],
            paint: {
              'circle-radius': 3,
              'circle-color': HISTORY_POINT_COLOR,
              'circle-opacity': 0.7,
              'circle-stroke-width': 1,
              'circle-stroke-color': '#fff',
              'circle-stroke-opacity': 0.4,
            },
          }, 'ships-halo');

          map.on('click', ptId, (e) => {
            const feat = e.features[0];
            showHistoryPointPopup(feat, feat.geometry.coordinates.slice(), shipId);
          });
          map.on('mouseenter', ptId, () => { map.getCanvas().style.cursor = 'pointer'; });
          map.on('mouseleave', ptId, () => { map.getCanvas().style.cursor = ''; });
        }

        activeHistory.add(shipId);

        // Fit map to history bounds
        const lineFeat = geojson.features.find(f => f.geometry.type === 'LineString');
        if (lineFeat) {
          const coords = lineFeat.geometry.coordinates;
          if (coords.length > 1) {
            const bounds = coords.reduce(
              (b, c) => b.extend(c),
              new maplibregl.LngLatBounds(coords[0], coords[0])
            );
            map.fitBounds(bounds, { padding: 60, maxZoom: 12 });
          }
        }

        showToast(`History loaded for MMSI ${shipId}`);
      } catch (err) {
        console.error('Failed to load history', err);
        showToast('Failed to load history – see console.');
      }
    }

    function removeHistory(shipId) {
      const srcId  = `history-${shipId}`;
      const lineId = `history-line-${shipId}`;
      const ptId   = `history-pts-${shipId}`;

      [lineId, ptId].forEach(id => { if (map.getLayer(id)) map.removeLayer(id); });
      if (map.getSource(srcId)) map.removeSource(srcId);

      activeHistory.delete(shipId);
      showToast(`History hidden for MMSI ${shipId}`);
    }

    // ── Utility ───────────────────────────────────────────────────────────────
    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ── Stale filter ─────────────────────────────────────────────────────────
    function getVisibleFeatures() {
      let features = liveFeatures;
      if (hideStaleShips) {
        const cutoff = Date.now() - 60 * 60 * 1000;
        features = features.filter(f => {
          const ua = f.properties.updated_at;
          return ua && new Date(ua).getTime() >= cutoff;
        });
      }
      if (trackedOnly) {
        features = features.filter(f => f.properties.tracked);
      }
      return features;
    }

    function _applyFilters() {
      const visible = getVisibleFeatures();
      map.getSource('ships').setData({ type: 'FeatureCollection', features: visible });
      updateSidebar();
      const ts = new Date().toLocaleTimeString();
      document.getElementById('status-text').textContent =
        `${visible.length} ships  ·  updated ${ts}`;
    }

    function onHideStaleToggle(checked) {
      hideStaleShips = checked;
      _applyFilters();
    }

    function onTrackedOnlyToggle(checked) {
      trackedOnly = checked;
      _applyFilters();
    }

    // ── Ship Details Modal ────────────────────────────────────────────────────
    async function openShipDetails(shipId) {
      const overlay = document.getElementById('ship-details-overlay');
      const title   = document.getElementById('modal-title');
      const body    = document.getElementById('modal-body');

      title.textContent = 'Loading…';
      body.innerHTML    = '';
      overlay.classList.add('open');

      try {
        const resp = await fetch(`/api/ships/${shipId}/static`);
        if (resp.status === 404) {
          title.textContent = `MMSI ${shipId}`;
          body.innerHTML = '<p style="color:#888; text-align:center; margin-top:8px;">No static data available for this ship.</p>';
          return;
        }
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const d = await resp.json();

        title.textContent = escHtml(d.ship_name || `MMSI ${shipId}`);

        const rows = [
          ['MMSI',        d.ship_id],
          ['IMO Number',  d.imo_number  || '—'],
          ['Call Sign',   d.call_sign   || '—'],
          ['Ship Type',   d.ship_type   || '—'],
          ['Destination', d.destination || '—'],
          ['ETA',         d.eta         || '—'],
          ['Length',      d.length_m  != null ? `${d.length_m} m`  : '—'],
          ['Width',       d.width_m   != null ? `${d.width_m} m`   : '—'],
          ['Draught',     d.draught_m != null ? `${d.draught_m} m` : '—'],
          ['Updated',     d.updated_at ? new Date(d.updated_at).toLocaleString() : '—'],
        ];

        body.innerHTML = rows.map(([label, value]) => `
          <div class="modal-row">
            <span class="modal-label">${escHtml(String(label))}</span>
            <span class="modal-value">${escHtml(String(value))}</span>
          </div>
        `).join('');
      } catch (err) {
        console.error('Failed to load ship details', err);
        title.textContent = `MMSI ${shipId}`;
        body.innerHTML = '<p style="color:#e94560; text-align:center; margin-top:8px;">Failed to load details.</p>';
      }
    }

    function closeShipDetails(event) {
      if (event && event.target !== document.getElementById('ship-details-overlay')) return;
      document.getElementById('ship-details-overlay').classList.remove('open');
    }

    // ── Boot ─────────────────────────────────────────────────────────────────
    initMap();
  </script>
</body>
</html>
